# Feature flags for the test application only.
#
# Breadcrumbs is experimental in Vaadin 25.3: com.vaadin.flow.component.breadcrumbs.Breadcrumbs
# throws an ExperimentalFeatureException on attach unless this flag is enabled, and the
# vaadin-breadcrumbs web components are not registered unless the generated
# src/main/frontend/generated/vaadin-featureflags.js enables the flag too.
#
# The file lives in src/main/resources because that is where both the Vaadin dev mode and
# the vaadin-maven-plugin build-frontend goal read it from. It is excluded from the
# published jar (see maven-jar-plugin in pom.xml) so it never enables the flag in
# applications using this library.
com.vaadin.experimental.breadcrumbsComponent=true
