# Switch component
# Enables the experimental com.vaadin.flow.component.checkbox.Switch component
# used by SwitchView / SwitchViewIT. Kept in the test resources so the flag is
# only enabled for the test UIs, never for consumers of the published library.
com.vaadin.experimental.switchComponent=true

# Breadcrumbs component
# Enables the experimental com.vaadin.flow.component.breadcrumbs.Breadcrumbs
# component used by BreadcrumbsView / BreadcrumbsViewIT. The vaadin-breadcrumbs
# web components are only registered when build-frontend sees this flag too,
# which is why the it profile points javaResourceFolder here.
com.vaadin.experimental.breadcrumbsComponent=true
